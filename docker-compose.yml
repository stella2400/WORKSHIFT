name: workshift

services:
  db:
    image: postgres:16-alpine
    container_name: workshift-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workshift}
      POSTGRES_USER: ${POSTGRES_USER:-workshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workshift}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workshift} -d ${POSTGRES_DB:-workshift}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workshift-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-workshift}:${POSTGRES_PASSWORD:-workshift}@db:5432/${POSTGRES_DB:-workshift}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      UPLOADS_DIR: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      ADMIN_REGISTRATION_TOKEN: ${ADMIN_REGISTRATION_TOKEN:-change-this-admin-token}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workshift-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  uploads_data:
